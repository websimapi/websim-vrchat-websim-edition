<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat - Websim Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <div class="background-vortex"></div>
            <div class="content">
                <h1 class="logo">
                    <span class="vr">VR</span><span class="chat">CHAT</span>
                    <span class="websim">WEBSIM</span>
                </h1>
                <p class="tagline">Connect, Create, Explore</p>
                
                <div class="menu-buttons">
                    <button class="btn primary" onclick="showLogin()">
                        <span>Enter World</span>
                        <div class="glow"></div>
                    </button>
                    <button class="btn secondary" onclick="showSettings()">
                        <span>Settings</span>
                    </button>
                    <button class="btn secondary" onclick="showCredits()">
                        <span>Credits</span>
                    </button>
                </div>

                <div class="world-preview">
                    <div class="preview-card active">
                        <img src="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=400&h=300&fit=crop" alt="World Preview">
                        <div class="preview-info">
                            <h3>Midnight Rooftop</h3>
                            <p>12 users online</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="particles" id="particles"></div>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <div class="login-container">
                <h2>Join VRChat</h2>
                <form id="login-form">
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="btn primary">Enter</button>
                </form>
                <button class="btn text" onclick="showTitle()">Back</button>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" class="screen">
            <div class="settings-container">
                <h2>Settings</h2>
                <div class="setting-group">
                    <label>Graphics Quality</label>
                    <select>
                        <option>Ultra</option>
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Audio Volume</label>
                    <input type="range" min="0" max="100" value="75">
                </div>
                <button class="btn primary" onclick="showTitle()">Save & Back</button>
            </div>
        </div>

        <!-- World Loading Screen -->
        <div id="loading-screen" class="screen">
            <div class="loading-container">
                <div class="loading-text">Entering world...</div>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <div class="loading-tip">Tip: Press ESC to open quick menu</div>
            </div>
        </div>

        <!-- Main Game UI (Hidden initially) -->
        <div id="game-ui" class="screen">
            <div class="hud">
                <div class="avatar-info">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=50&h=50&fit=crop&crop=face" alt="Avatar">
                    <span>Guest_User</span>
                </div>
                <div class="quick-menu-hint">Menu</div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
